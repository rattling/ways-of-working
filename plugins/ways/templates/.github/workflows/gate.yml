# The gate: the same command the Stop hook runs in autonomous mode, read from .claude/ways.json
# so there is one place to change it. Make this a required check in branch protection.
#
# The runner and the steps before the gate depend on the stack: docs/standards/delivery.md,
# "CI by stack", has them, and /ways:setup fills them in. Every step runs in bash (Git Bash on
# Windows), so the same lines work on ubuntu-latest and windows-latest.
#
# Sized for Actions minutes: each job bills rounded up to the whole minute, and private repos on
# the free plan get 2,000 a month. /ways:build opens a PR per ticket into an integration branch;
# those rely on the builder's local gate and the Stop hook, so CI runs only on PRs into main:
# - not on drafts: a draft integration PR runs once, when it's marked ready;
# - a newer push cancels the PR's run in progress (never a push to main);
# - a PR that changes only documentation passes at once, without running the gate. It's done in
#   a step, not with paths-ignore, because a required check that never reports blocks the PR;
# - every push to main runs in full, so a deploy can rely on "this commit passed the Gate".

name: Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Minimal token: the gate only reads the code. Widen per job, never here (security.md, "The supply
# chain"). Actions are pinned to a commit SHA with the version in a comment; Dependabot's
# github-actions entry keeps them current.
permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest # windows-latest for .NET Framework (delivery.md, "CI by stack")
    if: ${{ !github.event.pull_request.draft }}
    defaults:
      run:
        shell: bash # Git Bash on windows-latest, whose default is PowerShell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Documentation only?
        id: docs
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '(\.md$|^specs/|^docs/)'; then
            echo "Only documentation changed: the gate passes without running."
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi
      # Secret scan of the commits this PR or push adds: catches what the pre-commit hook missed
      # or was skipped for. It runs on documentation-only PRs too, since a secret can be in a .md.
      # gitleaks is pinned by version and checksum; Dependabot can't update it, so bump both at the
      # routine upgrade (the checksum is in the release's gitleaks_<version>_checksums.txt).
      # Linux only: on a windows-latest gate, this step moves to a small ubuntu-latest job.
      - name: Secret scan
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then range="$BEFORE..HEAD"
          else range="-1"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --no-banner .
      # The stack's toolchain goes here, each step with the same `if:` as the gate
      # (delivery.md, "CI by stack"). None for a gate that runs in Docker Compose.
      - name: Run the gate
        if: steps.docs.outputs.only != 'true'
        run: bash -c "$(jq -r .gate .claude/ways.json)"
