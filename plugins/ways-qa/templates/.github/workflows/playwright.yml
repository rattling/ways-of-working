name: Playwright

# The suite on every PR, and nightly against the CI environment in environments.json.
# The HTML report and the traces of any failures are kept as artifacts for 30 days:
# that's the record of what ran, and what it found.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      qa_env:
        description: 'Environment (a name in environments.json). Empty for the CI default.'
        required: false

# Actions are pinned to a commit SHA, the version in the comment; Dependabot keeps them current.
# Read-only token: the suite only checks out and uploads artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the suite
        run: npx playwright test
        env:
          QA_ENV: ${{ inputs.qa_env }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
