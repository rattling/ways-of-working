<!doctype html>
<!--
  Example mock with a guided tour, from /ways:mock: a grants review and approval workflow.

  What it's for:    Harbour Arts Trust (fictional) gives small grants (£500 to £5,000) to local arts groups and runs it
                    from a shared inbox and a spreadsheet. This mock settles what the replacement looks like, and which
                    part has to be built: everything is a standard low-code platform except one custom screen.
  Where the data is from: made up for this example. 12 fictional applications, groups and people, including the awkward
                    ones: a missing budget (HAT-104), a duplicate (HAT-106), one over the limit (HAT-107), a very long
                    group name (HAT-102), assessors who disagree (HAT-102), one still waiting for its second assessor
                    (HAT-108), one with no phone number (HAT-103), and a late one that rolls into the next round (HAT-111).
  Decisions it settles (the guide has a step per decision):
    1. One record per application, with a status and assessors, instead of email threads.
    2. Incomplete applications (no budget, over the limit, duplicates) are caught at the door, not by the panel.
    3. Scoring is the only custom part: the weighted, two-assessor rule doesn't fit a standard form.
    4. Disagreement between assessors (more than 2 points on a criterion) is flagged, not averaged away; a comment is required.
    5. The panel decides against the real budget, with a running total showing what fits.
    6. Every decision is kept on the record with who and why.
    7. Decision letters come from the approved record only, through a standard document template.
  Rounds:           round 1, first draft for the example pack.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Arts Trust grants (mock)</title>
<style>
:root{--ink:#18212b;--ink2:#3a4654;--muted:#667281;--line:#e2e6eb;--line2:#eef1f4;--bg:#f3f5f8;--card:#fff;
  --accent:#0e6b84;--accent2:#e6f3f6;--navy:#10283a;--std:#0969da;--custom:#8250df;--banner:#fff8c5;
  --ok:#1a7f37;--okbg:#e7f5ea;--warn:#9a6700;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fdecea;--r:8px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:650}
h2{font-size:15px;font-weight:650}
h3{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b5a6f}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

/* The banner: says it's a mock, and holds the three demo controls. */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 16px;background:var(--banner);border-bottom:1px solid #e7d87a;font-size:13px}
.banner .sp{flex:1}
.banner .btn{padding:3px 10px;font-size:13px}
.banner .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.archkey{display:none;gap:12px}
body.arch .archkey{display:flex}
.archkey i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* App chrome */
.appbar{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;background:var(--navy);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#2bb3c9;color:var(--navy);font-size:13px}
.logo span{opacity:.6;font-weight:400}
.appbar .sp{flex:1}
.who{display:flex;align-items:center;gap:9px;font-size:13px}
.who small{display:block;opacity:.65;font-size:11.5px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:650;color:#fff;flex:none}
.av.s{width:22px;height:22px;font-size:9.5px}
.shell{display:flex;min-height:calc(100vh - 52px - 31px)}
.side{width:224px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 10px}
.side .nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;color:var(--ink2);font-weight:500;text-align:left}
.side .nv:hover{background:var(--line2)}
.side .nv.on{background:var(--accent2);color:var(--accent)}
.side .nv .ct{margin-left:auto;font-size:11.5px;background:var(--line2);color:var(--muted);border-radius:10px;padding:0 7px}
.side .nv.on .ct{background:#fff}
.side h3{padding:16px 10px 6px}
.side .rnd{margin:4px 10px;font-size:12.5px;color:var(--muted)}
.mini{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
main{flex:1;min-width:0;padding:22px 28px 120px;max-width:1320px}

.cmdbar{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px}
.cmdbar .tt{flex:1}
.cmdbar .tt p{margin:3px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card>.hd h2{flex:1}
.card>.bd{padding:14px 16px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.chip b{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:#cfd6de}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
th button{border:0;background:none;padding:0;font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center}
th .ar{opacity:.35}th.on .ar{opacity:1;color:var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:#f7fafc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gname{font-weight:600;max-width:360px}
.gsub{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:#e8f0fe;color:#1a56c4}.p-incomplete{background:var(--warnbg);color:var(--warn)}
.p-duplicate{background:#eef0f3;color:#57606a}.p-ineligible{background:var(--badbg);color:var(--bad)}
.p-inscoring{background:#efeafd;color:#6a3fc4}.p-scored{background:#e3f4f6;color:#0b6577}
.p-approved{background:var(--okbg);color:var(--ok)}.p-declined{background:var(--badbg);color:var(--bad)}
.miss{display:inline-block;border:1px dashed #d4a72c;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600}
.people{display:flex;flex-direction:column;gap:3px;font-size:13px}
.people span{display:flex;align-items:center;gap:6px}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Record */
.rhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.rhead .tt{flex:1}
.rhead .meta{display:flex;gap:12px;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r);margin-bottom:16px;border:1px solid}
.alert.warn{background:var(--warnbg);border-color:#f1d98b;color:#6b4a00}
.alert.bad{background:var(--badbg);border-color:#f4c1bb;color:#8a1c12}
.alert.ok{background:var(--okbg);border-color:#b7e1c1;color:#165c2b}
.alert.info{background:#eef0f3;border-color:#d8dde3;color:var(--ink2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.sec{padding:14px 16px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:10px}
.fields .w{grid-column:1/-1}
.fl label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.fl div{padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:#fbfcfd;min-height:32px}
.chk{display:flex;gap:9px;padding:7px 0;align-items:flex-start}
.chk .ic{margin-top:2px}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-na{color:var(--muted)}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.file:last-child{border-bottom:0}
.file .fi{display:grid;place-items:center;width:30px;height:34px;border-radius:4px;background:#eef3f7;color:var(--accent);font-size:9px;font-weight:700}
.file div{flex:1;min-width:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 26px}
.tl li::before{content:"";position:absolute;left:7px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tl li::after{content:"";position:absolute;left:12px;top:19px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.new::before{background:var(--accent)}
.tl .when{font-size:12px;color:var(--muted)}
.mail{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.mail:last-child{border-bottom:0}

/* Scoring */
.sgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.pick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:10px 14px}
.pick:hover{background:#f7fafc}
.pick.on{background:var(--accent2);box-shadow:inset 3px 0 0 var(--accent)}
.pick .gname{font-size:13.5px}
.score-top{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:0}
.score-top>div:first-child{border-right:1px solid var(--line2)}
@media(max-width:1600px){.score-top{grid-template-columns:1fr}.score-top>div:first-child{border-right:0;border-bottom:1px solid var(--line2)}}
.crit b{display:block}
.wt{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent2);border-radius:4px;padding:0 6px}
.seg{display:inline-flex;gap:2px;vertical-align:middle}
.seg button{width:19px;height:24px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:10.5px;padding:0;color:var(--muted)}
.seg button.f{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.b button.f{background:#2a8fa6;border-color:#2a8fa6}
.seg button:disabled{cursor:not-allowed}
.sv{display:inline-block;width:28px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.gap{font-weight:650;font-variant-numeric:tabular-nums}
tr.diff td{background:#fff8ec}
tr.diff .gap{color:var(--bad)}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{font-size:16px;color:var(--muted);font-weight:500}
.meter{height:8px;border-radius:4px;background:var(--line2);margin:10px 0 14px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2bb3c9,var(--accent))}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.kv b{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:84px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;resize:vertical}
textarea.err{border-color:var(--bad);box-shadow:0 0 0 3px #fdecea}
.errmsg{color:var(--bad);font-size:13px;margin-top:6px;display:flex;gap:6px}
.req{color:var(--bad)}

/* Panel */
.bstats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:12px}
.bstats div small{display:block;color:var(--muted);font-size:12px}
.bstats div b{font-size:20px;font-variant-numeric:tabular-nums}
.bbar{position:relative;height:16px;border-radius:8px;background:var(--line2);overflow:hidden;display:flex}
.bbar .a{background:var(--ok)}
.bbar .p{background:repeating-linear-gradient(45deg,#9fd3dd 0 6px,#bfe3ea 6px 12px)}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
tr.line td{padding:4px 12px;background:#fff5f4;color:var(--bad);font-size:12px;font-weight:600;border-top:2px dashed #e99c94;border-bottom:2px dashed #e99c94}
tr.out td{color:var(--muted)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line2);font-weight:650;font-size:12px}
.flag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;color:var(--bad);background:var(--badbg);border-radius:4px;padding:0 6px}
.fit{font-size:12.5px;font-weight:600}
.fit.y{color:var(--ok)}.fit.n{color:var(--bad)}
.acts{display:flex;gap:6px}

/* Letter */
.lgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.paper{background:#fff;width:100%;max-width:720px;margin:0 auto;padding:56px 64px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);border-radius:2px;font:14.5px/1.6 Georgia,"Times New Roman",serif;color:#222}
.lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:28px;font-family:system-ui,sans-serif}
.lh .nm{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.lh .nm small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lh address{font-style:normal;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.paper p{margin:0 0 12px}
.paper .to{margin-bottom:22px}
.paper .ref{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);margin-bottom:18px}
.paper .subj{font-weight:700;margin-bottom:14px}
.paper ul{margin:0 0 12px;padding-left:20px}
.sig{margin-top:28px}
.sig .sn{font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;color:var(--navy);line-height:1.1}
.lfoot{margin-top:40px;padding-top:10px;border-top:1px solid #ddd;font:11px/1.4 system-ui,sans-serif;color:#888}
.paper.showmf .mf{background:#fff1b8;box-shadow:0 0 0 2px #fff1b8;border-radius:2px}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60}
#toast div{background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13.5px}

/* Show architecture: outline and label each part by how it's built. */
body.arch [data-arch]{position:relative;outline:2px dashed var(--std);outline-offset:2px}
body.arch [data-arch="custom"]{outline-color:var(--custom);outline-style:solid;outline-width:3px}
body.arch [data-arch]::after{content:attr(data-arch-label);position:absolute;top:-10px;right:8px;font:600 11px/1.5 system-ui,sans-serif;padding:1px 7px;border-radius:4px;background:var(--std);color:#fff;white-space:nowrap;z-index:5;pointer-events:none}
body.arch [data-arch="custom"]::after{background:var(--custom)}

/* The guide: bottom right, minimisable. */
.guide{position:fixed;right:20px;bottom:20px;width:min(370px,calc(100vw - 40px));background:var(--card);border-radius:10px;border-top:4px solid var(--accent);box-shadow:0 12px 36px rgba(16,40,58,.28);z-index:50}
.guide .gh{display:flex;align-items:center;gap:8px;padding:10px 14px 2px;font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.guide .gh span{flex:1}
.guide .gt{padding:2px 14px;font-weight:650;font-size:16px}
.guide .gb{padding:4px 14px;font-size:13.5px;color:var(--ink2)}
.guide .where{margin-top:9px;padding:6px 9px;border-radius:5px;background:var(--bg);font-size:12.5px;color:var(--muted)}
.guide .gf{display:flex;align-items:center;gap:6px;padding:10px 14px 12px}
.guide .prog{flex:1;display:flex;gap:3px}
.guide .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.guide .prog i.on{background:var(--accent)}
.guide.min .gt,.guide.min .gb,.guide.min .gf{display:none}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.pulse{animation:pulse 1.4s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,107,132,.6)}100%{box-shadow:0 0 0 16px rgba(14,107,132,0)}}

@page{size:A4 portrait;margin:16mm}
@media print{.banner,.guide,.appbar,.side,.cmdbar,.no-print,#toast{display:none!important}
  body{background:#fff}.shell{display:block}main{padding:0}.lgrid{display:block}.paper{box-shadow:none;padding:0;max-width:none}.paper .mf{background:none!important;box-shadow:none!important}}
</style>
</head>
<body>

  <b>Mock: not the build.</b><span>Harbour Arts Trust is fictional; every group, person and amount is made up.</span>

  <span class="sp"></span>
  <button class="btn" id="btn-arch" data-action="arch">Show architecture</button>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const DATA = JSON.parse($('#data').textContent)
const ROUND = DATA.round
const W = DATA.criteria.map((c) => c.weight)
const STATUSES = ['All', 'New', 'Incomplete', 'Duplicate', 'Ineligible', 'In scoring', 'Scored', 'Approved', 'Declined']
const CHAIR = 'Helen Marchetti'

// All state lives here, so Reset is one line.
let S
const initState = () => ({ view: 'list', selected: null, apps: structuredClone(DATA.apps), filter: 'All', sort: { key: 'id', dir: 1 },
  scoreId: 'HAT-108', comment: '', scoreErr: '', letterId: null, mf: true, toast: '', arch: false, guide: 0, guideMin: false })

const ICONS = {
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  score: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  panel: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  letter: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',
  bad: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  na: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',

  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', back: '<path d="m15 18-6-6 6-6"/>',
}
const ic = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`

// Helpers over the data.
const fmt = (n) => (n == null ? '' : '£' + n.toLocaleString('en-GB'))
const money = (n) => (n == null ? '<span class="miss">Missing</span>' : fmt(n))
const pill = (s) => `<span class="pill p-${s.toLowerCase().replace(/ /g, '')}">${esc(s)}</span>`
const initials = (n) => n.split(/[ -]/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('')
const av = (n, cls = 's') => `<span class="av ${cls}" style="background:${DATA.people[n] || '#667281'}">${initials(n)}</span>`
const first = (n) => n.split(' ')[0]
const getApp = (id) => S.apps.find((a) => a.id === id)
const wscore = (arr) => (arr.some((v) => v == null) ? null : arr.reduce((s, v, i) => s + v * W[i], 0) / 100)
const combined = (a) => { if (!a.scores) return null; const x = wscore(a.scores.A), y = wscore(a.scores.B); return x == null || y == null ? null : (x + y) / 2 }
const sc = (n) => (n == null ? '–' : n.toFixed(2))
const gaps = (a) => (a.scores ? DATA.criteria.map((c, i) => ({ c, i, a: a.scores.A[i], b: a.scores.B[i] })).filter((g) => g.a != null && g.b != null && Math.abs(g.a - g.b) > 2) : [])
const decided = (a) => a.status === 'Approved' || a.status === 'Declined'
const stamp = () => '12 May 2026, ' + new Date().toTimeString().slice(0, 5)
const checks = (a) => [
  { ok: a.amount != null, yes: 'Budget included', no: 'No budget or amount' },
  { ok: a.amount == null ? null : a.amount >= 500 && a.amount <= 5000, yes: 'Amount within £500 to £5,000', no: `Asks for ${fmt(a.amount)}, over the £5,000 limit`, na: "Amount can't be checked without a budget" },
  { ok: !a.dupOf, yes: 'Not already applied this round', no: `Same group and project as ${a.dupOf}` },
  { ok: a.round === ROUND.name, yes: `Arrived before ${ROUND.name} closed`, no: `Arrived after ${ROUND.closes}: moved to ${a.round}` },
]
// The panel's ranked list: scored applications in this round, best first, with a running total against the budget.
function ranked() {
  const list = S.apps.filter((a) => a.round === ROUND.name && ['Scored', 'Approved', 'Declined'].includes(a.status) && combined(a) != null)
    .sort((x, y) => combined(y) - combined(x))
  let run = 0
  return list.map((a, i) => { if (a.status !== 'Declined') run += a.amount; return { a, rank: i + 1, run, fits: run <= ROUND.budget } })
}
const approvedTotal = () => S.apps.filter((a) => a.status === 'Approved').reduce((s, a) => s + a.amount, 0)

function renderNav() {
  const n = (v, icon, label, ct) => `<button class="nv ${S.view === v || (v === 'list' && S.view === 'record') ? 'on' : ''}" data-action="nav" data-view="${v}">${ic(icon)}${label}${ct != null ? `<span class="ct">${ct}</span>` : ''}</button>`
  const pct = Math.min(100, (approvedTotal() / ROUND.budget) * 100)
  $('#nav').innerHTML = n('list', 'list', 'Applications', S.apps.length)
    + n('score', 'score', 'Scoring', S.apps.filter((a) => a.status === 'In scoring').length)
    + n('panel', 'panel', 'Panel', ranked().filter((r) => r.a.status === 'Scored').length)
    + n('letter', 'letter', 'Letters', S.apps.filter((a) => a.status === 'Approved').length)
    + `<h3>Current round</h3><div class="rnd"><b style="color:var(--ink)">${ROUND.name}</b><br>Closed ${ROUND.closes}<br>Panel ${ROUND.panel}
       <div style="margin-top:8px">${fmt(approvedTotal())} of ${fmt(ROUND.budget)} approved</div><div class="mini"><i style="width:${pct}%"></i></div></div>`
}

const SCREENS = {
  list: () => {

  score: () => {

    return `<div class="cmdbar"><div class="tt"><h1>Scoring</h1><p>Two assessors score each application from 1 to 10 against four weighted criteria.</p></div></div>

        ${list.map((x) => `<button class="pick ${x.id === a.id ? 'on' : ''}" data-action="score-pick" data-id="${x.id}"><div class="gname">${esc(x.group)}</div>

  letter: () => {
    const done = S.apps.filter((a) => a.status === 'Approved')
    if (!done.length) return `<div class="cmdbar"><div class="tt"><h1>Decision letters</h1></div></div>
      <div class="card" id="letter"><div class="empty"><b>No approved applications yet</b>A letter is made from the record once the panel approves it.<br><br><button class="btn primary" data-action="nav" data-view="panel">Go to the panel</button></div></div>`
    const a = done.find((x) => x.id === S.letterId) || done[0]
    const m = (v) => `<span class="mf">${esc(v)}</span>`
    const first80 = Math.round(a.amount * 0.8)
    return `<div class="cmdbar"><div class="tt"><h1>Decision letters</h1><p>Made from the approved record. Nobody retypes a name or an amount.</p></div>
      <button class="btn ${S.mf ? 'on' : ''}" data-action="mf">${S.mf ? 'Hide' : 'Show'} merge fields</button><button class="btn primary" data-action="print">${ic('print')}Print or save PDF</button></div>

    <div class="paper ${S.mf ? 'showmf' : ''}" id="letter" data-arch="std" data-arch-label="Standard document template">
      <div class="lh"><div class="nm">Harbour Arts Trust<small>Small grants for local arts</small></div><address>The Customs House, Quay Parade<br>Harbourmouth HB1 5EQ<br>grants@harbourarts.example.org</address></div>
      <div class="to">${m(a.contact)}<br>${m(a.group)}<br>${a.address.map(m).join('<br>')}</div>

function approve(id) {
  const r = ranked(), row = r.find((x) => x.a.id === id), a = row.a
  a.status = 'Approved'
  const left = ROUND.budget - approvedTotal()
  a.history.push({ when: stamp(), who: `Panel (chair ${CHAIR})`, what: `Approved ${fmt(a.amount)}. Ranked ${row.rank} of ${r.length} with a combined score of ${sc(combined(a))}; ${fmt(left)} of the budget left after this.` })
  a.history.push({ when: stamp(), who: 'System', what: 'Decision letter made from this record and emailed to the contact' })
  a.emails.push({ when: '12 May 2026', to: a.email, subject: `Your Harbour Arts Trust grant: approved (${a.id})` })
  flash(`${a.id} approved. The email and letter go from the standard workflow.`)
}
function decline(id) {
  const r = ranked(), row = r.find((x) => x.a.id === id), a = row.a, left = ROUND.budget - approvedTotal()
  a.status = 'Declined'
  a.history.push({ when: stamp(), who: `Panel (chair ${CHAIR})`, what: `Declined. Ranked ${row.rank} of ${r.length}; ${a.amount > left ? `asked for ${fmt(a.amount)} with ${fmt(left)} left in the budget` : `the panel funded higher-scoring applications first`}.` })
  a.emails.push({ when: '12 May 2026', to: a.email, subject: `Your Harbour Arts Trust application: decision (${a.id})` })
  flash(`${a.id} declined. The reason is kept on the record.`)
}
function ensureApproved() {
  let a = S.apps.find((x) => x.status === 'Approved')
  if (!a) { approve(ranked()[0].a.id); a = S.apps.find((x) => x.status === 'Approved') }
  return a.id
}

let toastTimer
function flash(msg) {
  S.toast = msg; $('#toast').innerHTML = `<div>${esc(msg)}</div>`
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; $('#toast').innerHTML = '' }, 3200)
}

  { t: 'Scoring is the only custom part', b: 'Two assessors each score four criteria, weighted 30, 30, 20 and 20. A standard form can\'t do that rule, so this one screen is built. Ama hasn\'t scored yet: click her scores and watch the combined score change.', where: 'Custom component, inside the standard app.', go: () => scorePick('HAT-108'), hl: '#score-grid' },
  { t: 'Disagreement is flagged, not averaged away', b: 'Tomasz gave Artistic quality 9 and Ama gave it 5. An average would hide that. More than 2 points apart is flagged here and on the panel list, and the comment can\'t be left empty: try <b>Save scores</b> with no comment.', where: 'Custom component.', go: () => scorePick('HAT-102'), hl: '#flag' },
  { t: 'The panel decides against the real budget', b: 'Scored applications, ranked, against the round\'s £12,000. The running total shows where the money runs out: the Film Club misses by £700. As the panel approves, the money left goes down, and Approve turns off for any request bigger than what is left.', where: 'Standard low-code app: a report view with approve and decline actions.', go: () => nav('panel'), hl: '#budget' },
  { t: 'Every decision is kept, with who and why', b: 'When the panel approves or declines, the record keeps who decided, when, the rank and the budget left. The email to the group goes automatically.', where: 'Standard workflow (email) and the record\'s history.', go: () => open(ensureApproved()), hl: '#history' },
  { t: 'Letters come from the approved record only', b: 'The letter is a standard template filled from the approved record. The highlighted parts are merge fields, so a name or an amount can\'t be typed wrong. There\'s no letter until the panel approves.', where: 'Standard document template.', go: () => { S.letterId = ensureApproved(); nav('letter') }, hl: '#letter' },
  { t: 'Standard, except scoring', b: 'Everything here is the standard low-code platform: the list, the form, the checks, the panel, the emails and the letter. Only the scoring screen is custom. <b>Show architecture</b> is on; <b>Reset demo</b> starts again.', go: () => { S.arch = true; nav('list') } },
]

function nav(view) { S.view = view; render() }
function open(id) { S.selected = id; S.view = 'record'; render() }
function scorePick(id) {
  const a = getApp(id)
  if (!a.scores) a.scores = { A: [null, null, null, null], B: [null, null, null, null] }
  if (S.scoreId !== id) S.comment = ''
  S.scoreId = id; S.scoreErr = ''; S.view = 'score'; render()
}

function render() {
  renderNav()
  $('#main').innerHTML = SCREENS[S.view]()
  document.body.classList.toggle('arch', S.arch)
  $('#btn-arch').classList.toggle('on', S.arch)
  renderGuide()
}

function renderGuide() {
  if (S.guide < 0) { $('#guide').innerHTML = ''; return }
  const g = GUIDE[S.guide]
  const last = S.guide === GUIDE.length - 1
  $('#guide').innerHTML = `<div class="guide ${S.guideMin ? 'min' : ''}">
    <div class="gh"><span>Demo guide · ${S.guide + 1} of ${GUIDE.length}</span>
      <button class="x" data-action="guide-min" title="Minimise">${S.guideMin ? '&#9650;' : '&#9660;'}</button>
      <button class="x" data-action="guide-close" title="Close">&times;</button></div>
    <div class="gt">${g.t}</div>
    <div class="gb">${g.b}${g.where ? `<div class="where">${g.where}</div>` : ''}</div>
    <div class="gf"><button class="btn" data-action="guide-prev" ${S.guide ? '' : 'disabled'}>Back</button>
      <span class="prog">${GUIDE.map((_, i) => `<i class="${i <= S.guide ? 'on' : ''}"></i>`).join('')}</span>
      <button class="btn primary" data-action="guide-next">${last ? 'Finish' : 'Next'}</button></div>
  </div>`
}

function guideGo(i) {
  S.guide = i; S.guideMin = false
  GUIDE[i].go()
  render()
  const sel = GUIDE[i].hl
  if (sel) setTimeout(() => { const el = $(sel); if (el) { el.scrollIntoView({ block: 'nearest' }); el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 4300) } }, 60)
}

// Every button says what it does with data-action; one listener handles them all.
const ACTIONS = {
  nav: (el) => nav(el.dataset.view),
  open: (el) => open(el.dataset.id),
  filter: (el) => { S.filter = el.dataset.status; render() },
  sort: (el) => { const k = el.dataset.key; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; render() },
  toast: (el) => flash(el.dataset.msg),
  'score-pick': (el) => scorePick(el.dataset.id),
  set: (el) => { const a = getApp(S.scoreId); a.scores[el.dataset.who][+el.dataset.c] = +el.dataset.v; S.scoreErr = ''; render() },
  'score-save': () => {
    const a = getApp(S.scoreId), cb = combined(a), ga = gaps(a)
    if (cb == null) { S.scoreErr = 'Both assessors need to score all four criteria first.'; return render() }
    if (!S.comment.trim()) { S.scoreErr = 'Add a comment: the panel reads it beside the scores.'; return render() }
    a.status = 'Scored'
    a.history.push({ when: stamp(), who: a.assessors.join(', '), what: `Scores saved: combined ${sc(cb)}.${ga.length ? ` Assessors differ on ${ga.map((g) => g.c.name).join(', ')}, flagged for the panel.` : ''} "${S.comment.trim()}"` })
    S.comment = ''; S.scoreErr = ''; render(); flash(`Scores saved. ${a.id} is on the panel list.`)
  },
  approve: (el) => { approve(el.dataset.id); render() },
  decline: (el) => { decline(el.dataset.id); render() },
  letter: (el) => { S.letterId = el.dataset.id; nav('letter') },
  mf: () => { S.mf = !S.mf; render() },
  print: () => window.print(),
  arch: () => { S.arch = !S.arch; render() },
  'guide-open': () => guideGo(Math.max(0, S.guide)),
  'guide-next': () => (S.guide === GUIDE.length - 1 ? ((S.guide = -1), render()) : guideGo(S.guide + 1)),
  'guide-prev': () => guideGo(Math.max(0, S.guide - 1)),
  'guide-min': () => { S.guideMin = !S.guideMin; renderGuide() },
  'guide-close': () => { S.guide = -1; render() },
  reset: () => { const g = S.guide; S = initState(); flash('Demo reset: sample data back to the start.'); if (g < 0) { S.guide = -1; render() } else guideGo(0) },
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]')
  if (!el || el.disabled) return
  const c = $('#comment'); if (c) S.comment = c.value // keep the comment across re-renders
  if (ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el)
})

S = initState()
guideGo(0)
</script>
</body>
</html>
